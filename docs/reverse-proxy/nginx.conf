# Example nginx reverse proxy config for LLM Hub
#
# Terminates HTTPS and forwards to LLM Hub listening on 127.0.0.1:8765.
# LLM Hub streams responses via SSE (Server-Sent Events), so proxy
# buffering must stay off and read timeouts must be generous — a chat
# response can legitimately take minutes to finish streaming.
#
# Usage:
#   1. Replace `llm-hub.example.com` with your domain.
#   2. Point `ssl_certificate`/`ssl_certificate_key` at your cert (e.g. via certbot).
#   3. Copy to /etc/nginx/sites-available/llm-hub.conf and symlink into sites-enabled.

server {
    listen 80;
    listen [::]:80;
    server_name llm-hub.example.com;

    # Redirect all HTTP traffic to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name llm-hub.example.com;

    ssl_certificate     /etc/letsencrypt/live/llm-hub.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/llm-hub.example.com/privkey.pem;

    client_max_body_size 25m;  # allow image/PDF/audio attachments

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for SSE streaming (/v1/chat and friends): disable
        # response buffering so tokens reach the browser as they arrive.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Long-running streams: keep the connection open instead of
        # timing out mid-response.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
